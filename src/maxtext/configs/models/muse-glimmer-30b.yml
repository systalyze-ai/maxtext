# model config for Muse Glimmer 30B
# Every value below is transcribed from meta-models/Muse-Glimmer-30B `config.json`
# (`text_config`, model_type "muse_glimmer_text").
decoder_block: "muse_glimmer"
base_emb_dim: 6656          # hidden_size
base_num_decoder_layers: 52 # num_hidden_layers
base_num_query_heads: 32    # num_attention_heads
base_num_kv_heads: 2        # num_key_value_heads
head_dim: 128               # head_dim
base_mlp_dim: 19968         # intermediate_size
mlp_activations: ["silu", "linear"]  # hidden_activation "silu" with SwiGLU gating
vocab_size: 202048          # vocab_size
normalization_layer_epsilon: 1.0e-5  # rms_norm_eps
post_norm_eps: 1.0e-8       # post_norm_eps, used by the two post norms only
logits_via_embedding: false # tie_word_embeddings: false
attention_bias: false       # attention_bias: false
enable_dropout: false

# layer_types is (sliding, sliding, sliding, full) repeated 13 times over 52 layers.
# layer_rope_theta is 500000 on the sliding layers and 0 on the full-attention layers,
# so the full-attention layers are NoPE.
inhomogeneous_layer_cycle_interval: 4
sliding_window_size: 2048   # sliding_window
rope_type: "default"        # rope_parameters.rope_type
rope_max_timescale: 500000  # rope_parameters.rope_theta

# HF replaces the q_norm/k_norm pair with a single scale-free RMSNorm over the query,
# then multiplies by qk_scale_factor instead of dividing by sqrt(head_dim):
#   query_states = self.qk_norm(query_states) * self.qk_scale_factor
# HF applies attn_output * sigmoid(gate_proj(hidden_states)) before o_proj.
attention_output_gate: true
use_qk_norm: true
qk_norm_with_scale: false
qk_scale_factor: 3.87

# Logits are pre-scaled then tanh-softcapped: cap * tanh(logits * mult / cap).
final_logits_soft_cap: 20.0            # final_logit_softcapping
output_logits_multiplier: 0.19611613513818404  # output_multiplier
